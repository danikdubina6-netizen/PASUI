name: Run Voice Translator Bot

on:
  workflow_dispatch: # Ручной запуск кнопкой
  schedule:
    - cron: '0 */5 * * *' # Запуск каждые 5 часов

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 320 # Ограничиваем чуть больше 5 часов (максимум у GitHub 360 минут на джоб)

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v4

      - name: Установка Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Установка системных зависимостей (если нужны для аудио)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запуск бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
