name: Запустить бота

on:
  schedule:
    - cron: '0 */5 * * *'  # Запуск каждые 5 часов
  workflow_dispatch:        # Кнопка ручного запуска в GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300    # Лимит работы воркера (5 часов)

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v4

      - name: Установка Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запуск бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot.py
        
